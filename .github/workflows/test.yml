name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Bercy targets Apple Silicon Macs, so the tests run there too.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - name: Install dependencies
        run: npm ci
        env:
          # The unit tests do not start Electron, so skip its large binary download.
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - run: npm test
