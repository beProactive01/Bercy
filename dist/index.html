<div class="shell"><aside id="sidebar" aria-label="工作流列表"><div class="brand"><i class="logo" aria-hidden="true"><svg viewBox="200 200 624 624"><path d="M368 300V724M368 300H572a106 106 0 0 1 0 212H368M368 512H602a106 106 0 0 1 0 212H368" fill="none" stroke="#fff" stroke-width="56" stroke-linecap="round" stroke-linejoin="round"/><circle cx="368" cy="300" r="66" fill="#fff"/><circle cx="368" cy="512" r="66" fill="#fff"/><circle cx="368" cy="724" r="66" fill="#fff"/></svg></i>Bercy</div>

<main><header class="top"><button id="sideToggle" title="切换工作流列表" aria-label="切换工作流列表">◧</button><span id="crumb"></span><b>/</b><span id="pageType">工作流</span><div class="grow"></div><button class="quiet" id="scheduleFlow" hidden>定时执行</button><button class="quiet save-action" id="saveFlow">保存流程</button><button class="quiet" id="pin"></button><button class="square" id="more" aria-label="工作流选项" title="工作流选项">···</button></header>
<section id="library" hidden></section><section id="preferences" hidden></section><section id="workspaceEmpty" hidden><p class="library-empty" id="emptyTitle">暂无工作流</p></section><section class="taskhead"><div class="headrow"><h1 id="query"></h1><button class="rename-action" id="rename" title="重命名工作流" aria-label="重命名工作流">✎</button><span id="status"></span></div><p id="briefline" hidden></p><div class="toolrow"><nav aria-label="工作流视图"><button data-view="graph">工作流</button><button data-view="log">执行记录</button><button data-view="files">产物架 <em id="count"></em></button></nav><label class="approval-chip" id="approvalChip" title="运行中遇到命令或文件改动时如何处理">审批<select id="approvalMode" aria-label="审批方式"><option value="auto">自动</option><option value="ask">每次询问</option><option value="allow">全部允许</option></select></label><button class="secondary" id="continueFlow" hidden></button><button class="primary" id="play"></button></div></section>
<div id="workspace"><div class="work-surface"><section id="stage" aria-label="协作画布"><div class="mapbar"><div><span class="mapicon">⌘</span> 协作画布</div><select id="version" aria-label="工作流版本"></select></div><div id="approvalTray" class="approval-tray" aria-live="polite" hidden></div><div id="graphScroll"><div id="graph"><canvas id="wires" aria-hidden="true"></canvas><div id="nodes"></div></div></div><div class="mapfoot"><div class="legend"><i></i> 输入已就绪 <b></b> 等待上游</div><div class="demobox"><span id="seq"></span><details id="demoTools"><summary>演示工具</summary><div class="demolist"><button id="step"><b>推进一个事件</b><small>暂停自动播放，运行到下一次交付或改图</small></button><button id="speed" aria-label="切换演示速度"><b>播放速度 <span id="rate">1×</span></b><small>切换所有模拟工作流的播放速度</small></button><button id="inject"><b>模拟条件变化</b><small>补充素材信息或要求复核，观察分支调整</small></button></div></details></div></div></section>
<section id="listview" hidden><h2 id="listtitle"></h2><div id="rows"></div></section></div>

<header class="dock-header"><span class="dock-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4M4 14h4l2 3h4l2-3h4M12 3v9m-3-3 3 3 3-3"/></svg></span><h2 id="answerTitle">最终答复</h2><button id="answerClose" type="button" aria-label="收起最终答复" aria-controls="answer" title="收起最终答复"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="2.5" y="3.5" width="15" height="13" rx="2.5"/><path d="M8 4v12m3-8 2 2-2 2"/></svg></button></header>
